<title>{% block title %}Talaba yordamchisi{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <span class="logo">T</span>
    <span>Talaba yordamchisi</span>
  </a>
  <nav class="topnav">
